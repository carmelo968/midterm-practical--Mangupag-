<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goyoy Chocolate</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>Goyoy Chocolate</h1>
    <p>Sweet. Simple. Delicious.</p>
  </header>

  <nav aria-label="Main navigation">
    <a href="#about">About</a>
    <a href="#price">Price</a>
    <a href="#order">Order</a>
  </nav>

  <main>
    <section id="about">
      <h2>About Our Chocolate</h2>
      <p>Goyoy Chocolate is an affordable and delicious snack.</p>

      <img
        src="https://images.unsplash.com/photo-1548907040-4d42cfcf0c46?auto=format&fit=crop&w=500&q=80"
        alt="Chocolate pieces on a table"
      >
    </section>

    <section id="price">
      <h2>Price List</h2>

      <table>
        <caption>Goyoy Chocolate prices</caption>

        <thead>
          <tr>
            <th scope="col">Product</th>
            <th scope="col">Price</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Milk Chocolate</td>
            <td>₱25</td>
          </tr>

          <tr>
            <td>Dark Chocolate</td>
            <td>₱30</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section id="order">
      <h2>Order Now</h2>

      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="product">Choose chocolate</label>
        <select id="product" name="product" required>
          <option value="">Select one</option>
          <option value="milk">Milk Chocolate</option>
          <option value="dark">Dark Chocolate</option>
        </select>

        <button type="submit">Order</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Goyoy Chocolate</p>
  </footer>
</body>
</html>
